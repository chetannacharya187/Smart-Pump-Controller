[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200

; This is the magic. PIO will download this automatically!
lib_deps = 
    marcoschwartz/LiquidCrystal_I2C@^1.1.4

; Add these lines to enable Over-The-Air Wi-Fi updates
; --- OTA UPLOAD SETTINGS ---
upload_protocol = espota

; Change this to your ESP32's actual Local IP Address
upload_port = 192.168.X.X