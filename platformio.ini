[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200

; This is the magic. PIO will download this automatically!
lib_deps = 
    marcoschwartz/LiquidCrystal_I2C@^1.1.4

; Add these lines to enable Over-The-Air Wi-Fi updates
upload_protocol = espota
upload_port = pump-ota.local